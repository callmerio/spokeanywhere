name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: SpokenAnyWhere

jobs:
  build-gate:
    name: Build Gate
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Resolve Dependencies
        working-directory: spoke
        run: |
          swift package resolve

      - name: Build (Baseline)
        working-directory: spoke
        run: |
          set -o pipefail
          mkdir -p ci-logs
          if ! swift build 2>&1 | tee ci-logs/build.log; then
            echo "::group::Build Failure (tail -200)"
            tail -n 200 ci-logs/build.log || true
            echo "::endgroup::"
            {
              echo "### ❌ Build Gate Failed"
              echo ""
              echo "- Category: \`build\`"
              echo "- Command: \`swift build\`"
              echo "- Action: check compile errors in \`ci-logs/build.log\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "### ✅ Build Gate Passed"
            echo ""
            echo "- Category: \`build\`"
            echo "- Command: \`swift build\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: spoke/ci-logs/build.log
          retention-days: 7

  test-gate:
    name: Test Gate
    runs-on: macos-14
    needs: build-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Resolve Dependencies
        working-directory: spoke
        run: |
          swift package resolve

      - name: Run Tests (Baseline)
        working-directory: spoke
        run: |
          set -o pipefail
          mkdir -p ci-logs
          if ! swift test --parallel 2>&1 | tee ci-logs/test.log; then
            echo "::group::Test Failure (tail -200)"
            tail -n 200 ci-logs/test.log || true
            echo "::endgroup::"
            {
              echo "### ❌ Test Gate Failed"
              echo ""
              echo "- Category: \`tests\`"
              echo "- Command: \`swift test --parallel\`"
              echo "- Action: inspect failures in \`ci-logs/test.log\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "### ✅ Test Gate Passed"
            echo ""
            echo "- Category: \`tests\`"
            echo "- Command: \`swift test --parallel\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: spoke/ci-logs/test.log
          retention-days: 7

  concurrency-gate:
    name: Concurrency Gate
    runs-on: macos-14
    needs: [build-gate, test-gate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Resolve Dependencies
        working-directory: spoke
        run: |
          swift package resolve

      - name: Run Strict Concurrency Check
        working-directory: spoke
        run: |
          set -o pipefail
          mkdir -p ci-logs
          if ! ./Tests/run-concurrency-check.sh 2>&1 | tee ci-logs/concurrency.log; then
            echo "::group::Concurrency Check Failure (tail -200)"
            tail -n 200 ci-logs/concurrency.log || true
            echo "::endgroup::"
            {
              echo "### ❌ Concurrency Gate Failed"
              echo ""
              echo "- Category: \`concurrency\`"
              echo "- Command: \`./Tests/run-concurrency-check.sh\`"
              echo "- Action: review strict concurrency warnings in \`ci-logs/concurrency.log\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "### ✅ Concurrency Gate Passed"
            echo ""
            echo "- Category: \`concurrency\`"
            echo "- Command: \`./Tests/run-concurrency-check.sh\`"
            echo "- Details: Zero strict concurrency warnings detected"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Concurrency Check Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-logs
          path: spoke/ci-logs/concurrency.log
          retention-days: 7
