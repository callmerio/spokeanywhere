name: Build and Release

on:
  push:
    tags:
      - "v*" # 推送 v1.0.0 这样的 tag 时触发
  workflow_dispatch: # 手动触发

env:
  APP_NAME: SpokenAnyWhere
  SCHEME: SpokenAnyWhere

jobs:
  # 发布前强制执行 Sanitizer 通道，未通过则阻断发布产物构建。
  pre-release-sanitizer:
    name: Pre-release Sanitizer Gate (Mandatory)
    uses: ./.github/workflows/sanitizer.yml
    secrets: inherit

  build:
    needs: pre-release-sanitizer
    runs-on: macos-14 # Apple Silicon runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve App Metadata
        id: app_meta
        run: |
          APP_VERSION="$(bash scripts/read-spoke-version.sh)"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Build Release
        working-directory: spoke
        run: |
          swift build -c release

      - name: Create App Bundle
        working-directory: spoke
        run: |
          APP_VERSION="${{ steps.app_meta.outputs.app_version }}"
          mkdir -p dist/SpokenAnyWhere.app/Contents/MacOS
          mkdir -p dist/SpokenAnyWhere.app/Contents/Resources

          # 复制可执行文件
          cp .build/release/SpokenAnyWhere dist/SpokenAnyWhere.app/Contents/MacOS/

          # 创建 Info.plist
          cat > dist/SpokenAnyWhere.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>SpokenAnyWhere</string>
            <key>CFBundleIdentifier</key>
            <string>com.spokeanywhere</string>
            <key>CFBundleName</key>
            <string>SpokenAnyWhere</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${APP_VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSMicrophoneUsageDescription</key>
            <string>SpokenAnyWhere needs microphone access for voice transcription.</string>
            <key>NSScreenCaptureUsageDescription</key>
            <string>实时字幕功能需要捕获系统音频</string>
            <key>NSSpeechRecognitionUsageDescription</key>
            <string>语音识别功能需要使用语音识别服务</string>
          </dict>
          </plist>
          EOF

          ls -la dist/

      - name: Create DMG
        working-directory: spoke
        run: |
          # 创建 DMG
          hdiutil create -volname "SpokenAnyWhere" \
            -srcfolder dist/SpokenAnyWhere.app \
            -ov -format UDZO \
            dist/SpokenAnyWhere.dmg

          ls -la dist/

      - name: Create ZIP
        working-directory: spoke
        run: |
          cd dist
          zip -r SpokenAnyWhere.zip SpokenAnyWhere.app
          ls -la

      - name: Get Version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="dev-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate Tag Matches App Version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          APP_VERSION="${{ steps.app_meta.outputs.app_version }}"
          if [[ "${TAG_VERSION#v}" != "$APP_VERSION" ]]; then
            echo "error: tag version ${TAG_VERSION} does not match Bundler.toml version ${APP_VERSION}" >&2
            exit 1
          fi

      - name: Resolve Release Notes
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_PATH="$(bash scripts/resolve-release-notes.sh "$VERSION")"
          if [[ "$VERSION" == *"-beta."* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "path=$NOTES_PATH" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: SpokenAnyWhere ${{ steps.version.outputs.version }}
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            spoke/dist/SpokenAnyWhere.dmg
            spoke/dist/SpokenAnyWhere.zip
          draft: false
          prerelease: ${{ steps.release_notes.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (for non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: SpokenAnyWhere-${{ steps.version.outputs.version }}
          path: |
            spoke/dist/SpokenAnyWhere.dmg
            spoke/dist/SpokenAnyWhere.zip
