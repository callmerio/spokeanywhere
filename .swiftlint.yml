# SwiftLint Configuration for SpokenAnyWhere
# https://github.com/realm/SwiftLint

# 包含的路径
included:
  - spoke

# 排除的路径
excluded:
  - .build
  - Spokenly
  - spoke/.build
  - spoke/Tests         # 测试代码允许更松散的标准
  - spoke/.deprecated   # 废弃代码不需要检查

# 禁用的规则
disabled_rules:
  - trailing_whitespace
  - todo
  - orphaned_doc_comment

# 启用的可选规则
opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - sorted_first_last
  - contains_over_first_not_nil
  - fatal_error_message
  - operator_usage_whitespace
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - single_test_class
  - sorted_imports
  - vertical_whitespace_closing_braces

# 行长度限制
line_length:
  warning: 120
  error: 260
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true

# 标识符命名
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - j
    - to
    - db

# 类型名称
type_name:
  min_length:
    warning: 2
    error: 2
  excluded:
    - DS

# 类型体长度 (复杂 UI 组件和核心业务类的实际情况)
type_body_length:
  warning: 560
  error: 800

# 文件长度 (复杂 SwiftUI 文件的实际情况)
file_length:
  warning: 850
  error: 2500
  ignore_comment_only_lines: true

# 函数体长度 (复杂业务逻辑的实际情况)
function_body_length:
  warning: 140
  error: 250

# 函数参数数量
function_parameter_count:
  warning: 6
  error: 8

# 嵌套深度
nesting:
  type_level:
    warning: 2
  function_level:
    warning: 3

# 圈复杂度 (复杂事件处理的实际情况)
cyclomatic_complexity:
  warning: 30
  error: 40

# 简写操作符
shorthand_operator:
  severity: warning

# 强制类型转换
force_cast:
  severity: warning

# 输出格式
reporter: "xcode"
